version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: agrosync_database
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: agrosync
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2048M
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: